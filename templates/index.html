<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal Tracker - {{ version }} | 24MIS0378</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #06b6d4;
            --success: #10b981;
            --warning: #f59e0b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--card-border);
            flex-wrap: wrap;
            gap: 1rem;
        }
        .title-group h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .title-group p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }
        .badge-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .badge {
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .badge-version {
            background: rgba(79, 70, 229, 0.2);
            color: #818cf8;
            border: 1px solid rgba(129, 140, 248, 0.3);
        }
        .badge-health {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
        }
        input, select, textarea {
            width: 100%;
            padding: 0.65rem 0.85rem;
            background-color: #0b1120;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: border-color 0.15s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        textarea {
            resize: vertical;
            min-height: 70px;
        }
        button.btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%);
            color: white;
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }
        button.btn-primary:hover {
            opacity: 0.9;
        }
        .goals-container {
            display: grid;
            gap: 1rem;
        }
        .goal-item {
            background-color: #131d31;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .goal-item:hover {
            transform: translateY(-2px);
            border-color: #475569;
        }
        .goal-info h3 {
            font-size: 1.1rem;
            color: #f1f5f9;
            margin-bottom: 0.35rem;
        }
        .goal-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 0.75rem;
        }
        .meta-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .meta-pill {
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
        }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }
        .notification {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            background: var(--success);
            color: white;
            font-weight: 500;
            font-size: 0.9rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title-group">
                <h1>Goal Tracker</h1>
                <p>Agile DevOps Lab &bull; Student Roll: <strong>24MIS0378</strong></p>
            </div>
            <div class="badge-group">
                <span class="badge badge-version" id="versionBadge">Version: {{ version }} (Add Goal)</span>
                <span class="badge badge-health" id="healthBadge">&bull; Healthy</span>
            </div>
        </header>

        <!-- v1 Feature: Add - Create Goal -->
        <div class="card">
            <h2>➕ Add New Goal (v1 Feature)</h2>
            <form id="goalForm">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="goalTitle">Goal Title *</label>
                        <input type="text" id="goalTitle" placeholder="e.g. Master Kubernetes & Docker CI/CD" required>
                    </div>
                    <div class="form-group full-width">
                        <label for="goalDescription">Description</label>
                        <textarea id="goalDescription" placeholder="Explain the key milestones and target outcomes..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="goalCategory">Category</label>
                        <select id="goalCategory">
                            <option value="Academic">Academic</option>
                            <option value="Career">Career & Skill</option>
                            <option value="Health">Health & Fitness</option>
                            <option value="Personal">Personal Development</option>
                            <option value="Finance">Finance</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="targetDate">Target Completion Date</label>
                        <input type="date" id="targetDate">
                    </div>
                </div>
                <button type="submit" class="btn-primary">Create Goal</button>
            </form>
        </div>

        <!-- Goals Display -->
        <div class="card">
            <h2>📋 Active Goals (<span id="goalCount">0</span>)</h2>
            <div id="goalsList" class="goals-container">
                <div class="empty-state">Loading goals...</div>
            </div>
        </div>
    </div>

    <div id="toast" class="notification"></div>

    <script>
        function showToast(msg, isSuccess = true) {
            const toast = document.getElementById("toast");
            toast.textContent = msg;
            toast.style.background = isSuccess ? "var(--success)" : "#ef4444";
            toast.style.display = "block";
            setTimeout(() => { toast.style.display = "none"; }, 3000);
        }

        async function fetchGoals() {
            try {
                const res = await fetch("/api/goals");
                const data = await res.json();
                renderGoals(data.goals);
            } catch (err) {
                console.error("Error fetching goals:", err);
            }
        }

        function renderGoals(goals) {
            const list = document.getElementById("goalsList");
            document.getElementById("goalCount").textContent = goals.length;

            if (!goals || goals.length === 0) {
                list.innerHTML = `<div class="empty-state">No goals created yet. Use the form above to add your first goal!</div>`;
                return;
            }

            list.innerHTML = goals.map(g => `
                <div class="goal-item" id="goal-${g.id}">
                    <div class="goal-info">
                        <h3>${escapeHtml(g.title)}</h3>
                        <p>${escapeHtml(g.description || 'No description provided.')}</p>
                        <div class="meta-tags">
                            <span class="meta-pill">🏷️ ${escapeHtml(g.category)}</span>
                            <span class="meta-pill">📅 Due: ${escapeHtml(g.target_date)}</span>
                            <span class="meta-pill">⚡ Status: ${escapeHtml(g.status)}</span>
                            <span class="meta-pill">🕒 ${escapeHtml(g.created_at)}</span>
                        </div>
                    </div>
                </div>
            `).reverse().join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, function(m) {
                return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[m];
            });
        }

        document.getElementById("goalForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const title = document.getElementById("goalTitle").value.trim();
            const description = document.getElementById("goalDescription").value.trim();
            const category = document.getElementById("goalCategory").value;
            const target_date = document.getElementById("targetDate").value;

            if (!title) return;

            try {
                const res = await fetch("/api/goals", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title, description, category, target_date })
                });

                if (res.ok) {
                    showToast("Goal created successfully!");
                    document.getElementById("goalForm").reset();
                    fetchGoals();
                } else {
                    const err = await res.json();
                    showToast(err.error || "Failed to create goal", false);
                }
            } catch (err) {
                showToast("Network error creating goal", false);
            }
        });

        // Initial load
        fetchGoals();
    </script>
</body>
</html>
