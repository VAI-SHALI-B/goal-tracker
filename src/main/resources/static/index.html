<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal Tracker - v2 | 24MIS0378</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #06b6d4;
            --success: #10b981;
            --warning: #f59e0b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2.5rem 1rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--card-border);
            flex-wrap: wrap;
            gap: 1rem;
        }
        .title-group h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .title-group p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.35rem;
        }
        .badge-group {
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }
        .badge {
            padding: 0.4rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .badge-version {
            background: rgba(79, 70, 229, 0.2);
            color: #818cf8;
            border: 1px solid rgba(129, 140, 248, 0.4);
        }
        .badge-health {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.4);
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.75rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 1.25rem;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }
        input, select, textarea {
            width: 100%;
            padding: 0.75rem 0.9rem;
            background-color: #0b1120;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: border-color 0.2s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        textarea {
            resize: vertical;
            min-height: 75px;
        }
        button.btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%);
            color: white;
            padding: 0.85rem 1.75rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }
        button.btn-primary:hover {
            opacity: 0.9;
        }
        button.btn-edit {
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.3);
            color: #38bdf8;
            padding: 0.45rem 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        button.btn-edit:hover {
            background: rgba(6, 182, 212, 0.25);
        }
        .goals-container {
            display: grid;
            gap: 1rem;
        }
        .goal-item {
            background-color: #131d31;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .goal-item:hover {
            transform: translateY(-2px);
            border-color: #475569;
        }
        .goal-info h3 {
            font-size: 1.15rem;
            color: #f1f5f9;
            margin-bottom: 0.4rem;
        }
        .goal-info p {
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.45;
            margin-bottom: 0.85rem;
        }
        .meta-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .meta-pill {
            font-size: 0.75rem;
            padding: 0.25rem 0.55rem;
            border-radius: 6px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
        }
        .status-completed {
            color: #34d399;
            border-color: rgba(52, 211, 153, 0.4);
        }
        .status-inprogress {
            color: #38bdf8;
            border-color: rgba(56, 189, 248, 0.4);
        }
        .status-pending {
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.4);
        }
        .empty-state {
            text-align: center;
            padding: 3.5rem 1rem;
            color: var(--text-muted);
        }
        .notification {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 0.85rem 1.35rem;
            border-radius: 8px;
            background: var(--success);
            color: white;
            font-weight: 500;
            font-size: 0.92rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4);
            display: none;
            z-index: 1000;
        }
        /* v2 Edit Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 1rem;
        }
        .modal {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            max-width: 520px;
            width: 100%;
            padding: 1.75rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }
        .modal-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }
        .btn-cancel {
            background: #334155;
            color: white;
            padding: 0.75rem 1.25rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 50%;
            font-weight: 600;
        }
        .btn-cancel:hover {
            background: #475569;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title-group">
                <h1>Goal Tracker</h1>
                <p>Spring Boot 3 &bull; Java 21 &bull; Student Roll: <strong>24MIS0378</strong></p>
            </div>
            <div class="badge-group">
                <span class="badge badge-version" id="versionBadge">Version: v2 (Add & Modify Goal)</span>
                <span class="badge badge-health" id="healthBadge">&bull; System Healthy</span>
            </div>
        </header>

        <!-- v1 Feature: Add - Create Goal -->
        <div class="card">
            <h2>➕ Add New Goal</h2>
            <form id="goalForm">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="goalTitle">Goal Title *</label>
                        <input type="text" id="goalTitle" placeholder="e.g., Complete Agile CI/CD Pipeline Lab" required>
                    </div>
                    <div class="form-group full-width">
                        <label for="goalDescription">Description</label>
                        <textarea id="goalDescription" placeholder="Specify milestones, acceptance criteria, or target deliverables..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="goalCategory">Category</label>
                        <select id="goalCategory">
                            <option value="Academic">Academic</option>
                            <option value="Career">Career & Skill</option>
                            <option value="Health">Health & Fitness</option>
                            <option value="Personal">Personal Development</option>
                            <option value="Finance">Finance</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="targetDate">Target Completion Date</label>
                        <input type="date" id="targetDate">
                    </div>
                </div>
                <button type="submit" class="btn-primary">Create Goal</button>
            </form>
        </div>

        <!-- Goals Display with v2 Modify Controls -->
        <div class="card">
            <h2>📋 Active Goals (<span id="goalCount">0</span>)</h2>
            <div id="goalsList" class="goals-container">
                <div class="empty-state">Loading goals...</div>
            </div>
        </div>
    </div>

    <!-- v2 Modal: Modify / Update Goal -->
    <div id="editModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>✏️ Modify Goal (v2 Feature)</h3>
            </div>
            <form id="editForm">
                <input type="hidden" id="editGoalId">
                <div class="form-group">
                    <label for="editTitle">Goal Title *</label>
                    <input type="text" id="editTitle" required>
                </div>
                <div class="form-group">
                    <label for="editDescription">Description</label>
                    <textarea id="editDescription"></textarea>
                </div>
                <div class="form-group">
                    <label for="editCategory">Category</label>
                    <select id="editCategory">
                        <option value="Academic">Academic</option>
                        <option value="Career">Career & Skill</option>
                        <option value="Health">Health & Fitness</option>
                        <option value="Personal">Personal Development</option>
                        <option value="Finance">Finance</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editTargetDate">Target Date</label>
                    <input type="date" id="editTargetDate">
                </div>
                <div class="form-group">
                    <label for="editStatus">Status</label>
                    <select id="editStatus">
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editProgress">Progress Percentage (0 - 100%)</label>
                    <input type="number" id="editProgress" min="0" max="100">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn-primary" style="width: 50%;">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="notification"></div>

    <script>
        let currentGoals = [];

        function showToast(msg, isSuccess = true) {
            const toast = document.getElementById("toast");
            toast.textContent = msg;
            toast.style.background = isSuccess ? "var(--success)" : "#ef4444";
            toast.style.display = "block";
            setTimeout(() => { toast.style.display = "none"; }, 3000);
        }

        async function fetchGoals() {
            try {
                const res = await fetch("/api/goals");
                const data = await res.json();
                currentGoals = data.goals || [];
                renderGoals(currentGoals);
            } catch (err) {
                console.error("Error fetching goals:", err);
            }
        }

        async function checkHealth() {
            try {
                const res = await fetch("/health");
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById("healthBadge").textContent = `• Healthy (${data.version})`;
                }
            } catch (err) {
                document.getElementById("healthBadge").textContent = `• Offline`;
                document.getElementById("healthBadge").style.background = "rgba(239, 68, 68, 0.2)";
                document.getElementById("healthBadge").style.color = "#f87171";
            }
        }

        function renderGoals(goals) {
            const list = document.getElementById("goalsList");
            document.getElementById("goalCount").textContent = goals.length;

            if (!goals || goals.length === 0) {
                list.innerHTML = `<div class="empty-state">No goals added yet. Use the form above to create your first goal!</div>`;
                return;
            }

            list.innerHTML = goals.map(g => {
                let statusClass = "status-pending";
                if (g.status === "Completed") statusClass = "status-completed";
                else if (g.status === "In Progress") statusClass = "status-inprogress";

                return `
                <div class="goal-item" id="goal-${g.id}">
                    <div class="goal-info">
                        <h3>${escapeHtml(g.title)}</h3>
                        <p>${escapeHtml(g.description || 'No description provided.')}</p>
                        <div class="meta-tags">
                            <span class="meta-pill">🏷️ ${escapeHtml(g.category)}</span>
                            <span class="meta-pill">📅 Due: ${escapeHtml(g.targetDate)}</span>
                            <span class="meta-pill ${statusClass}">⚡ ${escapeHtml(g.status)} (${g.progressPct || 0}%)</span>
                            <span class="meta-pill">🕒 ${escapeHtml(g.updatedAt ? g.updatedAt.replace('T', ' ').substring(0, 19) : 'Recent')}</span>
                        </div>
                    </div>
                    <div>
                        <button class="btn-edit" onclick="openEditModal(${g.id})">✏️ Modify</button>
                    </div>
                </div>
                `;
            }).reverse().join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, function(m) {
                return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[m];
            });
        }

        function openEditModal(goalId) {
            const goal = currentGoals.find(g => g.id === goalId);
            if (!goal) return;

            document.getElementById("editGoalId").value = goal.id;
            document.getElementById("editTitle").value = goal.title;
            document.getElementById("editDescription").value = goal.description || "";
            document.getElementById("editCategory").value = goal.category;
            document.getElementById("editTargetDate").value = (goal.targetDate && goal.targetDate !== "Not Specified") ? goal.targetDate : "";
            document.getElementById("editStatus").value = goal.status || "Pending";
            document.getElementById("editProgress").value = goal.progressPct || 0;

            document.getElementById("editModal").style.display = "flex";
        }

        function closeEditModal() {
            document.getElementById("editModal").style.display = "none";
        }

        // v2 Form Handler: Modify Goal
        document.getElementById("editForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const id = document.getElementById("editGoalId").value;
            const title = document.getElementById("editTitle").value.trim();
            const description = document.getElementById("editDescription").value.trim();
            const category = document.getElementById("editCategory").value;
            const targetDate = document.getElementById("editTargetDate").value;
            const status = document.getElementById("editStatus").value;
            const progressPct = parseInt(document.getElementById("editProgress").value, 10) || 0;

            if (!title) {
                showToast("Goal title cannot be empty", false);
                return;
            }

            try {
                const res = await fetch(`/api/goals/${id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title, description, category, targetDate, status, progressPct })
                });

                if (res.ok) {
                    showToast("Goal modified successfully!");
                    closeEditModal();
                    fetchGoals();
                } else {
                    const err = await res.json();
                    showToast(err.error || "Failed to update goal", false);
                }
            } catch (err) {
                showToast("Network error updating goal", false);
            }
        });

        // v1 Form Handler: Add Goal (Preserved)
        document.getElementById("goalForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const title = document.getElementById("goalTitle").value.trim();
            const description = document.getElementById("goalDescription").value.trim();
            const category = document.getElementById("goalCategory").value;
            const targetDate = document.getElementById("targetDate").value;

            if (!title) return;

            try {
                const res = await fetch("/api/goals", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title, description, category, targetDate })
                });

                if (res.ok) {
                    showToast("Goal created successfully!");
                    document.getElementById("goalForm").reset();
                    fetchGoals();
                } else {
                    const err = await res.json();
                    showToast(err.error || "Failed to create goal", false);
                }
            } catch (err) {
                showToast("Network error creating goal", false);
            }
        });

        fetchGoals();
        checkHealth();
    </script>
</body>
</html>
